name: Test ActionProof
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: node --test --test-isolation=none
      - run: node --experimental-vm-modules scripts/check.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m adapter.benchmark --output dist/adapter-evidence.json
      - run: node scripts/bundle.mjs
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_smoke.py
      - run: python scripts/record-demo.py
      - uses: actions/upload-artifact@v4
        with:
          name: actionproof-browser-evidence
          path: |
            artifacts/
            dist/adapter-evidence.json
  verify-public-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify-deployment.py https://actionproof-ollie.onrender.com --commit 75901b79bf6a6dfb14b586340738a6cb718ae851 --output artifacts/live-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: actionproof-live-verification
          path: artifacts/live-verification.json
